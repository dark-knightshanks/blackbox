name: blackbox build
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make protobuf-compiler libprotobuf-dev
      - name: generate protobuf files
        run: |
          protoc --cpp_out=include onnx.proto3
      - name: build 
        run: |
          make clean
          make